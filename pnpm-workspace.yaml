packages:
  - apps/*
  - packages/*

# Install scripts are allowed only for these dependencies. Review any additions
# when upgrading packages rather than enabling every dependency's build script.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Every third-party version lives here and nowhere else. Packages reference
# entries with `catalog:`, so a dependency cannot drift between apps/web and
# packages/ui. Upgrade by editing one line, then `pnpm install`.
catalog:
  # Framework and runtime
  next: 16.3.3
  react: 19.2.8
  react-dom: 19.2.8

  # Backend and data access
  "@supabase/ssr": 0.12.5
  "@supabase/supabase-js": 2.112.4
  "@vercel/queue": 0.5.1
  postgres: 3.4.9
  zod: 4.5.2

  # Catalogue import and scraping
  cheerio: 1.2.0
  domhandler: 5.0.3

  # Interface and visualisation
  "@date-fns/tz": 1.5.0
  "@xyflow/react": 12.11.5
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  cmdk: 1.1.1
  date-fns: 4.4.0
  geist: 1.7.2
  highlight.js: 11.12.0
  lucide-react: 1.34.0
  maplibre-gl: 6.7.0
  motion: 13.4.0
  next-themes: 0.4.6
  radix-ui: 1.6.7
  react-day-picker: 10.0.1
  recharts: 3.10.1
  sonner: 2.0.8
  tailwind-merge: 3.6.0

  # Styling
  "@tailwindcss/postcss": 4.3.3
  tailwindcss: 4.3.3
  tailwindcss-animate: 1.0.7

  # Types
  "@types/geojson": 7946.0.16
  "@types/node": 24.13.3
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.5

  # Toolchain
  eslint: 9.39.5
  eslint-config-next: 16.3.3
  eslint-config-prettier: 10.1.8
  prettier: 3.9.6
  prettier-plugin-tailwindcss: 0.8.1
  turbo: 2.10.12
  typescript: 5.9.3

  # Testing
  "@playwright/test": 1.63.0
  "@testing-library/jest-dom": 6.9.1
  "@testing-library/react": 16.3.3
  "@testing-library/user-event": 14.6.1
  jsdom: 30.0.1
  vitest: 5.0.0
